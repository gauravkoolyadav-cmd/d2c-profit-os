name: Profit Dashboard Sync

# Calls the protected cron endpoint of the deployed app.
# Repository secrets needed: APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET.
on:
  schedule:
    - cron: '*/15 * * * *'  # Google Sheet economics + Meta spend
    - cron: '7 * * * *'     # hourly Shopify catch-up (missed webhooks)
  workflow_dispatch:
    inputs:
      job:
        description: 'Which sync to run'
        required: true
        default: 'all'
        type: choice
        options: [all, sheet, meta, shopify]

jobs:
  sync:
    name: Run profit sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decide job
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "jobs=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 * * * *" ]; then
            echo "jobs=shopify" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=sheet meta" >> "$GITHUB_OUTPUT"
          fi

      - name: Call cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          for job in ${{ steps.job.outputs.jobs }}; do
            echo "Running $job"
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/profit-sync?job=$job"
            echo
          done
